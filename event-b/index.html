<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event B · 저장 이벤트 재생</title>
<style>body{margin:0;background:#10171c;color:#e8f0f3;font:16px system-ui}main{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:baseline;gap:20px}h1{font-size:26px}small,.muted{color:#a3b7c0}canvas{display:block;width:min(100%,960px);height:auto;border:1px solid #38515e;background:#000;image-rendering:pixelated}section{padding:16px 0}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px;border:1px solid #637e8c;border-radius:6px;background:#1d313d;color:white}button{cursor:pointer}input[type=range]{width:min(100%,960px)}.green{color:#65ed9b}.red{color:#ff7979}pre{white-space:pre-wrap;max-width:960px}#frameinfo{font-variant-numeric:tabular-nums}</style>
<main><header><h1>Event B</h1><small>저장 이벤트 재생 · 960 × 720</small></header><p><span class="green">● ON 녹색</span>　<span class="red">● OFF 빨강</span></p>
<canvas id="view" width="960" height="720" aria-label="960×720 이벤트 영상"></canvas>
<section class="controls"><button id="play" disabled>재생</button><label>속도 <select id="fps"><option>10</option><option selected>30</option><option>60</option></select> fps</label><label>표시 <select id="polarity"><option value="all">ON + OFF</option><option value="on">ON만</option><option value="off">OFF만</option></select></label></section>
<label for="seek">프레임 탐색</label><br><input id="seek" type="range" min="0" max="0" value="0" disabled><p id="frameinfo" aria-live="polite">파일을 읽는 중…</p>
<details open><summary>재생 결과와 통계</summary><pre id="stats"></pre></details><p class="muted">파일에서 디코딩한 논리 좌표입니다. 실제 손가락 위치·센서 전송 손실·물리 좌표의 정확성은 검증하지 않았습니다. 실시간 센서 입력은 비활성 상태입니다.</p></main><script type="module" src="viewer.js"></script></html>
