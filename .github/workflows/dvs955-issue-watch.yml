name: DVS 955-960 Issue Watch (5m)

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dvs955-issue-1-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect Codex results, notify subscribers once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPOSITORY"]
          root = f"https://api.github.com/repos/{repo}/issues/1"
          marker = re.compile(r"<!-- dvs955-watch-result:(\d+) -->")
          now = dt.datetime.now(dt.timezone.utc)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "s5krc1s-955-issue-watch",
          }

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, headers=headers, data=data, method=method)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          issue = api("GET", root)
          if issue["state"] != "open":
              print("ISSUE_CLOSED: no action")
              raise SystemExit(0)

          comments = []
          for page in range(1, 11):
              batch = api("GET", f"{root}/comments?per_page=100&page={page}")
              comments.extend(batch)
              if len(batch) < 100:
                  break
          notified = {
              int(value)
              for comment in comments
              for value in marker.findall(comment.get("body") or "")
          }

          source_ids = None
          if os.environ["GH_EVENT_NAME"] == "issue_comment":
              with open(os.environ["GH_EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)
              source_ids = {event["comment"]["id"]}

          fresh = []
          for comment in comments:
              author = comment.get("user", {}).get("login", "")
              body = comment.get("body") or ""
              cid = comment["id"]
              if author.endswith("[bot]") or cid in notified:
                  continue
              if "FACT:" not in body.upper() or "EVIDENCE:" not in body.upper():
                  continue
              if source_ids is not None and cid not in source_ids:
                  continue
              if source_ids is None:
                  created = dt.datetime.fromisoformat(comment["created_at"].replace("Z", "+00:00"))
                  if now - created > dt.timedelta(minutes=15):
                      continue
              fresh.append(comment)

          if not fresh:
              print("NO_NEW_CODEX_REPORT")
              raise SystemExit(0)

          links = "\n".join(f"- [Codex 결과 #{c['id']}]({c['html_url']})" for c in fresh)
          markers = "\n".join(f"<!-- dvs955-watch-result:{c['id']} -->" for c in fresh)
          notice = (
              "955/960 디버깅 Issue #1에 새 Codex 검증 결과가 등록됐습니다.\n\n"
              + links
              + "\n\nGitHub Actions 5분 감시 알림입니다. "
              + "ChatGPT의 기술 검토는 별도로 설정된 1시간 자동 감시에서 수행하며, "
              + "이 워크플로가 ChatGPT나 Codex를 직접 실행하지 않습니다.\n\n"
              + markers
          )
          result = api("POST", f"{root}/comments", {"body": notice})
          print(f"NOTIFIED: {len(fresh)} new result(s), comment {result['id']}")
          PY
